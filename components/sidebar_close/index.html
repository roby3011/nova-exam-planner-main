<!DOCTYPE html>
<html>
<head><style>html,body{margin:0;padding:0;height:0;overflow:hidden;}</style></head>
<body>
<script>
(function () {
  if (window.parent.innerWidth >= 768) return;

  function tryClose(attempts) {
    var b = window.parent.document.querySelector('[data-testid="stSidebarCollapseButton"]')
         || window.parent.document.querySelector('[data-testid="stSidebar"] button');
    if (b) {
      b.click();
      return;
    }
    /* Fallback: Escape key closes most overlay panels */
    window.parent.document.dispatchEvent(
      new KeyboardEvent('keydown', { key: 'Escape', code: 'Escape', keyCode: 27,
                                     bubbles: true, cancelable: true })
    );
    if (attempts > 0) setTimeout(function () { tryClose(attempts - 1); }, 200);
  }

  setTimeout(function () { tryClose(6); }, 300);
})();
</script>
</body>
</html>
